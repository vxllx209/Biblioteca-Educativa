<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca Educativa</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  :root{
    --accent:#0057FF;
    --accent-dark:#0041C4;
    --accent-light:#5C8DFF;
    --bg-tint:#EEF3FF;
    --sidebar-width:260px;
    --header-height:70px;
    --radius:12px;
    --shadow:0 1px 3px rgba(0,0,0,.1), 0 1px 2px rgba(0,0,0,.06);
    --shadow-lg:0 10px 25px -5px rgba(0,0,0,.15);
    --gray-50:#F9FAFB; --gray-100:#F3F4F6; --gray-200:#E5E7EB; --gray-300:#D1D5DB;
    --gray-400:#9CA3AF; --gray-500:#6B7280; --gray-600:#4B5563; --gray-700:#374151;
    --gray-800:#1F2937; --gray-900:#111827;
    --danger:#EF4444;
  }

  body{
    font-family:'Inter',sans-serif;
    background:var(--bg-tint);
    color:var(--gray-800);
    min-height:100vh;
    transition:background .4s ease;
  }

  [hidden]{ display:none !important; }

  button, input { font-family:'Inter',sans-serif; }

  /* ============== PANTALLA DE AUTENTICACIÓN ============== */
  #authScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg, var(--accent), var(--accent-dark));
    padding:20px;
    transition:background .4s ease;
  }

  .auth-card{
    background:#fff;
    width:100%;
    max-width:400px;
    border-radius:16px;
    box-shadow:var(--shadow-lg);
    padding:36px 32px;
  }

  .auth-brand{
    display:flex;
    align-items:center;
    gap:12px;
    justify-content:center;
    margin-bottom:8px;
  }

  .auth-brand i{ font-size:30px; color:var(--accent); }
  .auth-brand h1{ font-size:22px; font-weight:800; }

  .auth-card p.subtitle{
    text-align:center;
    color:var(--gray-500);
    font-size:13px;
    margin-bottom:24px;
  }

  .field{ margin-bottom:16px; }
  .field label{
    display:block; font-size:13px; font-weight:600;
    margin-bottom:6px; color:var(--gray-700);
  }
  .field input{
    width:100%;
    padding:11px 14px;
    border:1px solid var(--gray-200);
    border-radius:8px;
    font-size:14px;
    outline:none;
    transition:border .2s ease;
  }
  .field input:focus{ border-color:var(--accent); }

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:11px 20px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:8px;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    transition:background .2s ease, box-shadow .2s ease;
  }
  .btn:hover{ background:var(--accent-dark); }
  .btn:disabled{ opacity:.6; cursor:not-allowed; }
  .btn.btn-block{ width:100%; }
  .btn.btn-outline{
    background:transparent; color:var(--accent); border:1px solid var(--accent);
  }
  .btn.btn-outline:hover{ background:var(--accent); color:#fff; }
  .btn.btn-danger{ background:var(--danger); }
  .btn.btn-danger:hover{ background:#C53030; }

  .auth-switch{
    text-align:center;
    margin-top:18px;
    font-size:13px;
    color:var(--gray-500);
  }
  .auth-switch a{ color:var(--accent); font-weight:600; cursor:pointer; text-decoration:none; }

  .auth-error{
    background:#FEF2F2; color:#991B1B; border:1px solid #FECACA;
    padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:16px;
  }
  .auth-info{
    background:#ECFDF5; color:#065F46; border:1px solid #A7F3D0;
    padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:16px;
  }

  /* ============== APP PRINCIPAL ============== */
  .sidebar{
    width:var(--sidebar-width);
    background:#fff;
    border-right:1px solid var(--gray-200);
    position:fixed; top:0; left:0; height:100vh;
    overflow-y:auto; z-index:1000; padding:0;
    transition:transform .3s ease;
  }

  .sidebar-brand{
    padding:24px 20px; border-bottom:1px solid var(--gray-200);
    display:flex; align-items:center; gap:12px;
  }
  .sidebar-brand i{ font-size:26px; color:var(--accent); transition:color .4s ease; }
  .sidebar-brand h2{ font-size:17px; font-weight:800; }
  .sidebar-brand span{ font-size:11px; color:var(--gray-400); }

  .sidebar-nav{ padding:16px 12px; }
  .nav-label{
    font-size:11px; text-transform:uppercase; letter-spacing:.5px;
    color:var(--gray-400); font-weight:600; padding:0 12px; margin-bottom:8px;
  }

  .nav-link{
    display:flex; align-items:center; gap:12px;
    padding:11px 16px; border-radius:8px;
    color:var(--gray-600); text-decoration:none; font-size:14px; font-weight:500;
    margin-bottom:3px; cursor:pointer; border:none; background:none; width:100%;
    text-align:left; transition:background .2s ease, color .2s ease;
  }
  .nav-link i{ width:20px; font-size:15px; color:var(--gray-400); transition:color .2s ease; }
  .nav-link:hover{ background:var(--gray-100); color:var(--gray-800); }
  .nav-link.active{ background:var(--subject-color,var(--accent)); color:#fff; box-shadow:var(--shadow); }
  .nav-link.active i{ color:#fff; }
  .nav-link.logout{ color:var(--danger); margin-top:20px; }
  .nav-link.logout i{ color:var(--danger); }

  .main-content{ margin-left:var(--sidebar-width); min-height:100vh; }

  .header{
    height:var(--header-height);
    background:rgba(255,255,255,.95);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--gray-200);
    padding:0 32px;
    display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:100;
  }
  .header h1{ font-size:19px; font-weight:700; }
  .header h1 small{ display:block; font-weight:400; color:var(--gray-400); font-size:13px; }

  .header-right{ display:flex; align-items:center; gap:14px; }
  .user-name{ font-size:14px; font-weight:600; color:var(--gray-700); }
  .avatar{
    width:38px; height:38px; border-radius:50%;
    background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:14px; transition:background .4s ease;
  }

  .content{ padding:28px 32px; }

  /* Dashboard: tarjetas de materias */
  .subjects-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px; margin-bottom:8px;
  }
  .subject-card{
    background:#fff; border-radius:var(--radius); padding:24px;
    border:1px solid var(--gray-200); box-shadow:var(--shadow);
    cursor:pointer; transition:transform .2s ease, box-shadow .2s ease;
    border-top:5px solid var(--card-color, #999);
  }
  .subject-card:hover{ transform:translateY(-4px); box-shadow:var(--shadow-lg); }
  .subject-card.selected{ outline:2px solid var(--card-color,#999); }
  .subject-card .subj-icon{
    width:48px; height:48px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    font-size:20px; color:#fff; background:var(--card-color,#999); margin-bottom:14px;
  }
  .subject-card h3{ font-size:17px; font-weight:700; margin-bottom:4px; }
  .subject-card p{ font-size:13px; color:var(--gray-500); }

  /* Vista de materia: lista de PDFs */
  .section-header{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; gap:12px;
  }
  .section-header h3{ font-size:18px; font-weight:700; }

  .pdf-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:18px;
  }
  .pdf-card{
    background:#fff; border-radius:var(--radius); padding:18px;
    border:1px solid var(--gray-200); box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:10px;
  }
  .pdf-card .pdf-icon{ font-size:30px; color:var(--accent); }
  .pdf-card h4{ font-size:15px; font-weight:600; word-break:break-word; }
  .pdf-card .pdf-meta{ font-size:12px; color:var(--gray-500); }
  .pdf-card .pdf-actions{ display:flex; gap:8px; margin-top:auto; }
  .pdf-card .pdf-actions .btn{ flex:1; padding:8px 10px; font-size:13px; }

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--gray-400);
  }
  .empty-state i{ font-size:40px; margin-bottom:12px; display:block; }

  /* Modal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(17,24,39,.55);
    display:flex; align-items:center; justify-content:center; z-index:2000; padding:20px;
  }
  .modal{
    background:#fff; border-radius:16px; width:100%; max-width:440px;
    padding:28px; box-shadow:var(--shadow-lg);
  }
  .modal.modal-viewer{ max-width:900px; height:85vh; padding:0; display:flex; flex-direction:column; }
  .modal-viewer .modal-viewer-header{
    display:flex; justify-content:space-between; align-items:center; padding:16px 20px;
    border-bottom:1px solid var(--gray-200);
  }
  .modal-viewer iframe{ flex:1; width:100%; border:none; }
  .modal h3{ font-size:17px; font-weight:700; margin-bottom:18px; }
  .modal-close{
    background:none; border:none; font-size:18px; color:var(--gray-500); cursor:pointer;
  }
  .modal-actions{ display:flex; gap:10px; margin-top:20px; }
  .modal-actions .btn{ flex:1; }

  .toast{
    position:fixed; bottom:30px; right:30px; background:var(--gray-900); color:#fff;
    padding:14px 22px; border-radius:10px; box-shadow:var(--shadow-lg); font-size:14px; font-weight:500;
    transform:translateY(100px); opacity:0; transition:all .4s ease; z-index:3000;
  }
  .toast.show{ transform:translateY(0); opacity:1; }

  @media (max-width:768px){
    .sidebar{ transform:translateX(-100%); }
    .sidebar.open{ transform:translateX(0); }
    .main-content{ margin-left:0; }
    .header{ padding:0 16px; }
    .content{ padding:16px; }
  }

  .menu-toggle{
    display:none; background:none; border:none; font-size:20px; color:var(--gray-600); cursor:pointer;
  }
  @media (max-width:768px){ .menu-toggle{ display:block; } }
</style>
</head>
<body>

<!-- ============== PANTALLA LOGIN / REGISTRO ============== -->

<div class="toast" id="toast"></div>

<script>
/* ==================================================
   BACKEND LOCAL (sin Supabase por ahora)
   Cuentas en localStorage, PDFs (blobs) en IndexedDB.
   Cuando reconectemos Supabase, solo hay que reemplazar
   este objeto `backend` por llamadas a supabase-js;
   el resto de la app llama siempre a `backend.*`.
   ================================================== */
const DB_NAME = 'biblioteca_educativa';
const DB_VERSION = 1;

function abrirDB(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = ()=>{
      const db = req.result;
      if(!db.objectStoreNames.contains('pdfs')){
        const store = db.createObjectStore('pdfs', { keyPath:'id' });
        store.createIndex('subject', 'subject');
      }
    };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}

async function idbTx(storeName, mode, fn){
  const db = await abrirDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(storeName, mode);
    const store = tx.objectStore(storeName);
    const result = fn(store);
    tx.oncomplete = ()=> resolve(result && result.result !== undefined ? result.result : result);
    tx.onerror = ()=> reject(tx.error);
  });
}

function idbRequest(req){
  return new Promise((resolve, reject)=>{
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}

const LS_USERS = 'be_local_users';
const LS_SESSION = 'be_local_session';
let authListeners = [];

function leerUsuariosLocal(){
  try { return JSON.parse(localStorage.getItem(LS_USERS)) || []; }
  catch(e){ return []; }
}
function guardarUsuariosLocal(users){
  localStorage.setItem(LS_USERS, JSON.stringify(users));
}
function leerSesionLocal(){
  try { return JSON.parse(localStorage.getItem(LS_SESSION)) || null; }
  catch(e){ return null; }
}
function guardarSesionLocal(session){
  if(session) localStorage.setItem(LS_SESSION, JSON.stringify(session));
  else localStorage.removeItem(LS_SESSION);
  authListeners.forEach(cb => cb(session ? 'SIGNED_IN' : 'SIGNED_OUT', session));
}

const backend = {
  auth: {
    async signUp({ email, password }){
      const users = leerUsuariosLocal();
      if(users.find(u => u.email.toLowerCase() === email.toLowerCase())){
        return { data:null, error:{ message:'Ya existe una cuenta con ese correo.' } };
      }
      const user = { id: crypto.randomUUID(), email, password };
      users.push(user);
      guardarUsuariosLocal(users);
      const session = { user:{ id:user.id, email:user.email } };
      guardarSesionLocal(session);
      return { data:{ session }, error:null };
    },
    async signInWithPassword({ email, password }){
      const users = leerUsuariosLocal();
      const user = users.find(u => u.email.toLowerCase() === email.toLowerCase() && u.password === password);
      if(!user) return { error:{ message:'Correo o contraseña incorrectos.' } };
      const session = { user:{ id:user.id, email:user.email } };
      guardarSesionLocal(session);
      return { error:null };
    },
    async signOut(){ guardarSesionLocal(null); return {}; },
    async getSession(){ return { data:{ session: leerSesionLocal() } }; },
    onAuthStateChange(cb){
      authListeners.push(cb);
      return { data:{ subscription:{ unsubscribe(){ authListeners = authListeners.filter(f => f !== cb); } } } };
    },
  },
  pdfs: {
    async listBySubject(subject){
      const registros = await idbTx('pdfs', 'readonly', store => idbRequest(store.index('subject').getAll(subject)));
      return registros.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
    },
    async countBySubject(subject){
      const registros = await idbTx('pdfs', 'readonly', store => idbRequest(store.index('subject').getAll(subject)));
      return registros.length;
    },
    async upload({ subject, title, file, userId, userName }){
      const registro = {
        id: crypto.randomUUID(),
        subject, title,
        blob: file,
        uploaded_by: userId,
        uploader_name: userName,
        created_at: new Date().toISOString(),
      };
      await idbTx('pdfs', 'readwrite', store => store.add(registro));
    },
    async remove(id){
      await idbTx('pdfs', 'readwrite', store => store.delete(id));
    },
    getUrl(registro){
      return URL.createObjectURL(registro.blob);
    },
  },
};

/* ==================================================
   MATERIAS Y COLORES
   ================================================== */
const MATERIAS = {
  matematicas: { nombre:'Matemáticas', icon:'fa-calculator',   color:'#0057FF', dark:'#0041C4', light:'#5C8DFF', bgTint:'#EEF3FF' },
  lenguaje:    { nombre:'Lenguaje',    icon:'fa-book',         color:'#D62828', dark:'#A81E1E', light:'#FF7A7A', bgTint:'#FFF1F1' },
  historia:    { nombre:'Historia',    icon:'fa-landmark',     color:'#F2B705', dark:'#C79A04', light:'#FFDE70', bgTint:'#FFFBE6' },
  ciencias:    { nombre:'Ciencias',    icon:'fa-flask',        color:'#10B981', dark:'#0C8F63', light:'#5EEAB5', bgTint:'#ECFDF5' },
  ingles:      { nombre:'Inglés',      icon:'fa-language',     color:'#7C3AED', dark:'#5F27C9', light:'#B794F6', bgTint:'#F5F0FF' },
};
const MATERIA_KEYS = Object.keys(MATERIAS);

let state = {
  session: null,
  activeView: 'dashboard',
  activeSubject: 'matematicas',
  pdfCounts: {},
};

/* ==================================================
   UTILIDADES
   ================================================== */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 3000);
}

function nombreDesdeEmail(email){
  if(!email) return 'Usuario';
  const local = email.split('@')[0];
  const limpio = local.replace(/[._\-\d]+/g,' ').trim();
  if(!limpio) return local;
  return limpio.split(' ').filter(Boolean)
    .map(w => w.charAt(0).toUpperCase() + w.slice(1))
    .join(' ');
}

function inicialesDe(nombre){
  const partes = nombre.trim().split(' ').filter(Boolean);
  if(partes.length === 0) return '?';
  if(partes.length === 1) return partes[0].slice(0,2).toUpperCase();
  return (partes[0][0] + partes[1][0]).toUpperCase();
}

function aplicarTema(key){
  const m = MATERIAS[key];
  const root = document.documentElement;
  root.style.setProperty('--accent', m.color);
  root.style.setProperty('--accent-dark', m.dark);
  root.style.setProperty('--accent-light', m.light);
  root.style.setProperty('--bg-tint', m.bgTint);
  document.getElementById('sidebarNav').style.setProperty('--subject-color', m.color);
}

/* ==================================================
   AUTENTICACIÓN
   ================================================== */
function mostrarRegistro(){
  document.getElementById('loginForm').hidden = true;
  document.getElementById('registerForm').hidden = false;
  document.getElementById('toRegister').hidden = true;
  document.getElementById('toLogin').hidden = false;
  document.getElementById('authSubtitle').textContent = 'Crea tu cuenta para empezar a estudiar';
  document.getElementById('authMessage').innerHTML = '';
}
function mostrarLogin(){
  document.getElementById('loginForm').hidden = false;
  document.getElementById('registerForm').hidden = true;
  document.getElementById('toRegister').hidden = false;
  document.getElementById('toLogin').hidden = true;
  document.getElementById('authSubtitle').textContent = 'Inicia sesión para repasar y estudiar';
  document.getElementById('authMessage').innerHTML = '';
}

function mostrarMensajeAuth(msg, tipo){
  const el = document.getElementById('authMessage');
  const clase = tipo === 'error' ? 'auth-error' : 'auth-info';
  el.innerHTML = `<div class="${clase}">${msg}</div>`;
}

document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  const { error } = await backend.auth.signInWithPassword({ email, password });
  btn.disabled = false;
  if(error){
    mostrarMensajeAuth(error.message, 'error');
    return;
  }
});

document.getElementById('registerForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const email = document.getElementById('registerEmail').value.trim();
  const password = document.getElementById('registerPassword').value;
  const password2 = document.getElementById('registerPassword2').value;
  if(password !== password2){
    mostrarMensajeAuth('Las contraseñas no coinciden.', 'error');
    return;
  }
  const btn = document.getElementById('registerBtn');
  btn.disabled = true;
  const { error } = await backend.auth.signUp({ email, password });
  btn.disabled = false;
  if(error){
    mostrarMensajeAuth(error.message, 'error');
    return;
  }
});

document.getElementById('logoutBtn').addEventListener('click', async ()=>{
  await backend.auth.signOut();
});

backend.auth.onAuthStateChange((_event, session)=>{
  state.session = session;
  if(session){
    mostrarApp(session);
  } else {
    mostrarAuth();
  }
});

function mostrarAuth(){
  document.getElementById('authScreen').hidden = false;
  document.getElementById('app').hidden = true;
}

function mostrarApp(session){
  document.getElementById('authScreen').hidden = true;
  document.getElementById('app').hidden = false;
  const email = session.user.email;
  const nombre = nombreDesdeEmail(email);
  document.getElementById('userName').textContent = nombre;
  document.getElementById('userAvatar').textContent = inicialesDe(nombre);
  seleccionarMateria('matematicas');
  irADashboard();
}

/* ==================================================
   NAVEGACIÓN LATERAL
   ================================================== */
function construirMenuMaterias(){
  const cont = document.getElementById('subjectLinks');
  cont.innerHTML = '';
  MATERIA_KEYS.forEach(key=>{
    const m = MATERIAS[key];
    const btn = document.createElement('button');
    btn.className = 'nav-link';
    btn.dataset.subject = key;
    btn.innerHTML = `<i class="fas ${m.icon}"></i> ${m.nombre}`;
    btn.addEventListener('click', ()=>{ seleccionarMateria(key); irAMateria(key); });
    cont.appendChild(btn);
  });
}
construirMenuMaterias();

document.getElementById('sidebarNav').addEventListener('click', (e)=>{
  const dashBtn = e.target.closest('[data-view="dashboard"]');
  if(dashBtn) irADashboard();
});

function actualizarActivos(){
  document.querySelectorAll('.nav-link').forEach(a=>a.classList.remove('active'));
  if(state.activeView === 'dashboard'){
    document.querySelector('[data-view="dashboard"]').classList.add('active');
  } else {
    const el = document.querySelector(`[data-subject="${state.activeSubject}"]`);
    if(el) el.classList.add('active');
  }
}

function seleccionarMateria(key){
  state.activeSubject = key;
  aplicarTema(key);
}

/* ==================================================
   VISTAS
   ================================================== */
async function irADashboard(){
  state.activeView = 'dashboard';
  document.getElementById('view-dashboard').hidden = false;
  document.getElementById('view-subject').hidden = true;
  document.getElementById('pageTitle').innerHTML = 'Dashboard<small>Elige una materia para repasar</small>';
  actualizarActivos();
  await renderDashboard();
}

async function irAMateria(key){
  state.activeView = 'subject';
  document.getElementById('view-dashboard').hidden = true;
  document.getElementById('view-subject').hidden = false;
  const m = MATERIAS[key];
  document.getElementById('pageTitle').innerHTML = `${m.nombre}<small>Material de estudio en PDF</small>`;
  document.getElementById('subjectHeading').innerHTML = `<i class="fas ${m.icon}"></i> ${m.nombre}`;
  actualizarActivos();
  await cargarPdfs(key);
}

async function renderDashboard(){
  const grid = document.getElementById('subjectsGrid');
  grid.innerHTML = '';
  await Promise.all(MATERIA_KEYS.map(async key=>{
    state.pdfCounts[key] = await backend.pdfs.countBySubject(key);
  }));
  MATERIA_KEYS.forEach(key=>{
    const m = MATERIAS[key];
    const card = document.createElement('div');
    card.className = 'subject-card' + (key === state.activeSubject ? ' selected' : '');
    card.style.setProperty('--card-color', m.color);
    card.innerHTML = `
      <div class="subj-icon"><i class="fas ${m.icon}"></i></div>
      <h3>${m.nombre}</h3>
      <p>${state.pdfCounts[key]} PDF(s) disponibles</p>
    `;
    card.addEventListener('click', ()=>{ seleccionarMateria(key); irAMateria(key); });
    grid.appendChild(card);
  });
}

async function cargarPdfs(key){
  const grid = document.getElementById('pdfGrid');
  grid.innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i>Cargando...</div>';
  let data;
  try {
    data = await backend.pdfs.listBySubject(key);
  } catch(error){
    grid.innerHTML = `<div class="empty-state"><i class="fas fa-triangle-exclamation"></i>No se pudieron cargar los PDFs.</div>`;
    toast('Error al cargar PDFs: ' + error.message);
    return;
  }
  if(!data || data.length === 0){
    grid.innerHTML = `<div class="empty-state"><i class="fas fa-file-circle-question"></i>Todavía no hay PDFs en esta materia.</div>`;
    return;
  }
  grid.innerHTML = '';
  data.forEach(pdf=>{
    const url = backend.pdfs.getUrl(pdf);
    const esMio = state.session && pdf.uploaded_by === state.session.user.id;
    const card = document.createElement('div');
    card.className = 'pdf-card';
    card.innerHTML = `
      <i class="fas fa-file-pdf pdf-icon"></i>
      <h4>${pdf.title}</h4>
      <div class="pdf-meta">Subido por ${pdf.uploader_name || 'Usuario'} · ${new Date(pdf.created_at).toLocaleDateString()}</div>
      <div class="pdf-actions">
        <button class="btn btn-outline btn-ver"><i class="fas fa-eye"></i> Ver</button>
        ${esMio ? '<button class="btn btn-danger btn-borrar"><i class="fas fa-trash"></i></button>' : ''}
      </div>
    `;
    card.querySelector('.btn-ver').addEventListener('click', ()=> abrirVisor(pdf.title, url));
    const btnBorrar = card.querySelector('.btn-borrar');
    if(btnBorrar) btnBorrar.addEventListener('click', ()=> borrarPdf(pdf, key));
    grid.appendChild(card);
  });
}

async function borrarPdf(pdf, key){
  if(!confirm(`¿Eliminar "${pdf.title}"?`)) return;
  try {
    await backend.pdfs.remove(pdf.id);
  } catch(error){
    toast('Error al borrar: ' + error.message);
    return;
  }
  toast('PDF eliminado');
  cargarPdfs(key);
}

/* ==================================================
   VISOR DE PDF
   ================================================== */
let viewerObjectUrl = null;
function abrirVisor(titulo, url){
  document.getElementById('viewerTitle').textContent = titulo;
  document.getElementById('viewerFrame').src = url;
  viewerObjectUrl = url;
  document.getElementById('viewerModal').hidden = false;
}
document.getElementById('closeViewer').addEventListener('click', ()=>{
  document.getElementById('viewerModal').hidden = true;
  document.getElementById('viewerFrame').src = '';
  if(viewerObjectUrl){ URL.revokeObjectURL(viewerObjectUrl); viewerObjectUrl = null; }
});

/* ==================================================
   SUBIR PDF
   ================================================== */
document.getElementById('uploadBtn').addEventListener('click', ()=>{
  document.getElementById('uploadModal').hidden = false;
});
document.getElementById('cancelUpload').addEventListener('click', ()=>{
  document.getElementById('uploadModal').hidden = true;
  document.getElementById('uploadForm').reset();
});

document.getElementById('uploadForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const title = document.getElementById('pdfTitle').value.trim();
  const file = document.getElementById('pdfFile').files[0];
  if(!file) return;
  const btn = document.getElementById('confirmUpload');
  btn.disabled = true;
  btn.textContent = 'Subiendo...';

  const subject = state.activeSubject;
  const nombre = nombreDesdeEmail(state.session.user.email);

  try {
    await backend.pdfs.upload({
      subject, title, file,
      userId: state.session.user.id,
      userName: nombre,
    });
  } catch(error){
    toast('Error al subir el PDF: ' + error.message);
    btn.disabled = false; btn.innerHTML = 'Subir';
    return;
  }

  btn.disabled = false;
  btn.innerHTML = 'Subir';

  toast('PDF subido correctamente');
  document.getElementById('uploadModal').hidden = true;
  document.getElementById('uploadForm').reset();
  cargarPdfs(subject);
});

/* ==================================================
   MENÚ MÓVIL
   ================================================== */
document.getElementById('menuToggle').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.toggle('open');
});

/* ==================================================
   INICIO
   ================================================== */
(async function init(){
  aplicarTema('matematicas');
  const { data } = await backend.auth.getSession();
  state.session = data.session;
  if(state.session){
    mostrarApp(state.session);
  } else {
    mostrarAuth();
  }
})();
</script>
</body>
</html>
